version: '3.8'

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "9997:9997"   # API
    volumes:
      - /home/vms-server/mediamtx/mediamtx.yml:/mediamtx.yml
      - /root/recordings:/root/recordings
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
#    image: 38.109.10.122:8080/drishyam-repo-jsr-api:v1.0.1
    container_name: drishyam_api
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.ini:/app/config.ini
      - /home/vms-server/mediamtx/mediamtx.yml:/mediamtx.yml
      - /root/recordings:/root/recordings
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DB_HOST=host.docker.internal
      - MEDIAMTX_HLS_URL=http://mediamtx:8888
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - CONFIG_FILE_PATH=/app/config.ini
      - MEDIAMTX_CONFIG_PATH=/mediamtx.yml
      - PYTHONUNBUFFERED=1
    depends_on:
      - mediamtx

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
 #   image: 38.109.10.122:8080/drishyam-repo-jsr-frontend:v1.0.1
    container_name: drishyam_frontend
    ports:
      - "5000:5000"
    depends_on:
      - api
