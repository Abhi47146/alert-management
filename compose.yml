services:
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: drishyam_web
    image: web:latest
    ports:
      - "5000:5000"
    volumes:
      - ./vite.config.ts:/app/vite.config.ts:ro
  api:
    build:
     context: .
     dockerfile: api.Dockerfile
    image: api:latest
    container_name: drishyam_api
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    # Mount config.ini separately so you can change it without rebuilding
    volumes:
      - ./config.ini:/app/config.ini:ro
