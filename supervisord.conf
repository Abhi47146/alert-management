[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:bun]
command=/root/.bun/bin/bun run start
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/bun.log
stderr_logfile=/var/log/supervisor/bun_err.log
environment=PORT=8080

[program:flask]
command=/app/venv/bin/python app.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/flask.log
stderr_logfile=/var/log/supervisor/flask_err.log
environment=FLASK_ENV=production,PORT=8000
